name: Build and Upload to TestFlight

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-deploy:
    name: Build & Upload to TestFlight
    runs-on: macos-15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Select latest Xcode
        run: |
          sudo xcode-select -s /Applications/Xcode_16.app || sudo xcode-select -s /Applications/Xcode.app
          xcodebuild -version

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2'
          bundler-cache: true

      - name: Install Apple Certificate and Provisioning Profiles
        env:
          P12_BASE64: ${{ secrets.P12_BASE64 }}
          P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
          PROVISION_PROFILE_IOS_BASE64: ${{ secrets.PROVISION_PROFILE_IOS_BASE64 }}
          PROVISION_PROFILE_WATCH_BASE64: ${{ secrets.PROVISION_PROFILE_WATCH_BASE64 }}
        run: |
          # 1. 创建临时钥匙串
          KEYCHAIN_PATH=$RUNNER_TEMP/build.keychain
          KEYCHAIN_PASSWORD=$(openssl rand -base64 16)
          
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          
          # 加入用户钥匙串搜索列表
          ORIGINAL_KEYCHAINS=$(security list-keychains -d user | tr -d '"')
          security list-keychains -d user -s "$KEYCHAIN_PATH" $ORIGINAL_KEYCHAINS

          # 2. 导入 Distribution 证书 (.p12)
          echo "$P12_BASE64" | base64 --decode > $RUNNER_TEMP/cert.p12
          security import $RUNNER_TEMP/cert.p12 -P "$P12_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

          # 3. 安装 iOS 与 watchOS 描述文件
          PP_DIR="$HOME/Library/MobileDevice/Provisioning Profiles"
          mkdir -p "$PP_DIR"
          echo "$PROVISION_PROFILE_IOS_BASE64" | base64 --decode > "$PP_DIR/c91171c3-0cf8-4a27-a56d-fffabb9335ca.mobileprovision"
          echo "$PROVISION_PROFILE_WATCH_BASE64" | base64 --decode > "$PP_DIR/979174ac-a4d2-41a2-8ae6-184495b67086.mobileprovision"

          echo "Certificates and Provisioning Profiles installed successfully."

      - name: Fastlane Build and Upload to TestFlight
        env:
          APP_STORE_CONNECT_API_KEY_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_KEY_ID }}
          APP_STORE_CONNECT_API_KEY_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ISSUER_ID }}
          APP_STORE_CONNECT_API_KEY_KEY: ${{ secrets.APP_STORE_CONNECT_API_KEY_KEY }}
          DEVELOPMENT_TEAM: "876385K952"
        run: |
          bundle exec fastlane beta

      - name: Clean up Keychain and Profiles
        if: always()
        run: |
          security delete-keychain $RUNNER_TEMP/build.keychain || true
          rm -f "$HOME/Library/MobileDevice/Provisioning Profiles/c91171c3-0cf8-4a27-a56d-fffabb9335ca.mobileprovision" || true
          rm -f "$HOME/Library/MobileDevice/Provisioning Profiles/979174ac-a4d2-41a2-8ae6-184495b67086.mobileprovision" || true
