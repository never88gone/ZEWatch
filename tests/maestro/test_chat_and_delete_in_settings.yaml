appId: com.nevergone.zrxx.ios
---
- launchApp:
    clearState: false

- tapOn: "识海"
- extendedWaitUntil:
    visible: "立即唤醒戒灵"
    timeout: 10000
- tapOn: "立即唤醒戒灵"
- extendedWaitUntil:
    visible: "向墨老祈告..."
    timeout: 10000

# 发送神念祈告并断言墨老回复
- tapOn: "向墨老祈告..."
- inputText: "墨老，请传我无上修仙心法！"
- tapOn:
    id: "send_message_button"
- extendedWaitUntil:
    visible: ".*老夫.*"
    timeout: 15000
- takeScreenshot: "14_chat_response_in_home"

# 切换到设置页，验证并删除模型
- tapOn: "须弥戒"
- extendedWaitUntil:
    visible: "法器库管理 (大模型)"
    timeout: 10000
- assertVisible: "qwen2.5-0.5b-instruct-q4_k_m.gguf"
- tapOn: "Trash"
- extendedWaitUntil:
    visible: "法器囊空空如也（安装包未内置大模型，请点击下方下载）"
    timeout: 8000
- takeScreenshot: "15_model_deleted_in_settings"

# 切回识海首页，验证界面同步恢复纯净空明引导
- tapOn: "识海"
- extendedWaitUntil:
    visible: "识海空明 · 戒灵未凝"
    timeout: 8000
- takeScreenshot: "16_home_reset_to_empty"
