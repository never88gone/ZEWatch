appId: com.nevergone.zrxx.ios
---
- launchApp:
    clearState: false

# 1. 验证识海首页纯净无下载列表，仅有引导去设置页的按钮
- tapOn: "识海"
- extendedWaitUntil:
    visible: "识海空明 · 戒灵未凝"
    timeout: 10000
- assertVisible: "前往设置挑选并接引法器"
- takeScreenshot: "10_home_clean_empty_guide"

# 2. 点击前往设置，自动跳转须弥戒设置页的“大模型下载专区”
- tapOn:
    id: "goto_settings_download_button"
- extendedWaitUntil:
    visible: "天道接引 · 官方默认大模型下载"
    timeout: 10000
- assertVisible: "国内网络镜像加速 (hf-mirror.com)"
- assertVisible: "接引此法器（下载 约 390 MB）"
- takeScreenshot: "11_settings_download_center"

# 3. 在设置页触发下载并验证进度卡片
- tapOn: "接引此法器（下载 约 390 MB）"
- extendedWaitUntil:
    visible: ".*天道引灵中.*"
    timeout: 10000
- takeScreenshot: "12_settings_download_progress"

# 4. 在设置页取消下载
- tapOn:
    id: "cancel_download_button"
- extendedWaitUntil:
    notVisible: ".*天道引灵中.*"
    timeout: 10000
- assertVisible: "接引此法器（下载 约 390 MB）"
- takeScreenshot: "13_settings_download_cancelled"

# 5. 准备模型并进入首页进行对话验证
- runScript:
    file: ../scripts/inject_test_model.sh

- tapOn: "识海"
- extendedWaitUntil:
    visible: "立即唤醒戒灵"
    timeout: 10000
- tapOn: "立即唤醒戒灵"
- extendedWaitUntil:
    visible: "向墨老祈告..."
    timeout: 10000

# 发送神念祈告并断言墨老回复
- tapOn: "向墨老祈告..."
- inputText: "墨老，请传我无上修仙心法！"
- tapOn:
    id: "send_message_button"
- extendedWaitUntil:
    visible: ".*老夫.*"
    timeout: 15000
- takeScreenshot: "14_chat_response_in_home"

# 6. 回到设置页销毁删除模型
- tapOn: "须弥戒"
- extendedWaitUntil:
    visible: "法器库管理 (大模型)"
    timeout: 10000
- assertVisible: "qwen2.5-0.5b-instruct-q4_k_m.gguf"
- tapOn: "Trash"
- extendedWaitUntil:
    visible: "法器囊空空如也（安装包未内置大模型，请点击下方下载）"
    timeout: 8000
- takeScreenshot: "15_model_deleted_in_settings"

# 7. 切回识海首页，验证界面同步恢复纯净空明引导
- tapOn: "识海"
- extendedWaitUntil:
    visible: "识海空明 · 戒灵未凝"
    timeout: 8000
- takeScreenshot: "16_home_reset_to_empty"
